[project]
name = "privymed"
version = "0.1.0"
description = "Research prototype for de-identifying synthetic clinical-style text: rules vs Presidio vs fine-tuned transformer vs local LLM vs hybrid."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "abdu11ah11-code" }]
dependencies = [
    "datasketch>=2.0.0",
    "faker>=40.63.0",
    "numpy>=2.5.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
]

[project.scripts]
privymed-generate = "privymed.data_generation.dataset:main"
privymed-validate = "privymed.validation:main"
privymed-eval = "privymed.evaluation.runner:main"

# Heavy, milestone-specific dependencies are added as groups when their
# milestone starts (data, baselines, train, llm, onnx, api) so the base
# install stays small and each addition is deliberate.

[dependency-groups]
baselines = [
    "en-core-web-lg",
    "presidio-analyzer>=2.2.362",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "seqeval>=1.2.2",
]
train = [
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.3",
    "torch>=2.11.0",
    "transformers>=5.24.1",
]

[tool.uv]
# Plain `uv sync` installs everything needed to run the baselines and their tests.
default-groups = ["dev", "baselines"]

# PyTorch CUDA 12.8 wheels (driver 591.62 supports CUDA <= 13.1). Explicit index: only torch uses it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privymed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Data-only lookup tables: long wrapped literal rows read better than reflowed ones.
"src/privymed/data_generation/pools.py" = ["E501"]
# Template strings are data; short S/F aliases keep the family tables readable.
"src/privymed/data_generation/families.py" = ["E501", "N817"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["datasketch", "datasketch.*", "seqeval", "seqeval.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: loads large models (spaCy en_core_web_lg); deselect with -m \"not slow\""]
